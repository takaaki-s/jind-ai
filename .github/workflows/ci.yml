name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on pull requests only: pushing again to a PR makes the
# older run uninteresting, since only the tip is going to be merged.
#
# Pushes to main are serialized but never cancelled. A run there answers "is
# main broken?", and cancelling intermediate runs throws that away: after a
# burst of merges a red main can no longer be attributed to a commit. That is
# not hypothetical here — PRs are validated against main as it was when their
# CI ran, so two PRs open at the same time never test each other's changes.
# main is the first place that combination is exercised.
#
# github.workflow is part of the group so Release (tag-triggered) can never
# share a group with this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Bump together with the Makefile pin and the other workflow.
          # golangci-lint v2 needs the action at v7+. With no install-mode the
          # action downloads the release binary — see the Makefile note on why
          # that constrains go.mod's `go` directive.
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      # The opencode adapter embeds a TypeScript plugin. Without bun, the
      # tests that parse and exercise it skip silently, and a broken plugin
      # ships as "status never updates" with every Go test green.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Run tests with race detector
        run: go test -race -v ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Run E2E tests
        run: make test-e2e
